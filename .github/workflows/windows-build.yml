name: Compilar servidor (Windows)

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'sql/**'
      - 'contrib/addon/**'
  workflow_dispatch:

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 340

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Boost 1.74 (msvc-14.2)
        shell: pwsh
        run: |
          choco install boost-msvc-14.2 --version 1.74.0 -y --no-progress
          if (!(Test-Path C:\local\boost_1_74_0\lib64-msvc-14.2)) { throw "Boost no quedo instalado" }
          Get-ChildItem C:\local\boost_1_74_0\lib64-msvc-14.2\cmake | Select-Object -First 5 Name

      - name: Descargar MySQL 8.0.30 (libreria cliente)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://cdn.mysql.com/archives/mysql-8.0/mysql-8.0.30-winx64.zip -OutFile mysql.zip
          Expand-Archive mysql.zip -DestinationPath C:\mysqlzip
          Get-ChildItem C:\mysqlzip\mysql-8.0.30-winx64\lib\libmysql.*

      - name: Ubicar OpenSSL
        shell: pwsh
        run: |
          $ossl = "C:\Program Files\OpenSSL"
          if (!(Test-Path $ossl)) { choco install openssl -y --no-progress }
          Get-ChildItem $ossl -Recurse -Include libcrypto*.dll,libssl*.dll,legacy.dll | Select-Object FullName

      - name: Configurar (CMake)
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v142
          -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL"
          -DBOOST_ROOT="C:/local/boost_1_74_0"
          -DBOOST_LIBRARYDIR="C:/local/boost_1_74_0/lib64-msvc-14.2"
          -DBoost_DIR="C:/local/boost_1_74_0/lib64-msvc-14.2/cmake/Boost-1.74.0"
          -DCMAKE_POLICY_VERSION_MINIMUM="3.5"
          -DMYSQL_LIBRARY="C:/mysqlzip/mysql-8.0.30-winx64/lib/libmysql.lib"
          -DMYSQL_INCLUDE_DIR="C:/mysqlzip/mysql-8.0.30-winx64/include"
          -DSCRIPTS=1 -DTOOLS=0

      - name: Compilar
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Empaquetar
        shell: pwsh
        run: |
          $out = "dist\Pandaria548"
          New-Item -ItemType Directory -Force $out | Out-Null
          $bin = Get-ChildItem build -Recurse -Include worldserver.exe | Select-Object -First 1
          $dir = $bin.DirectoryName
          Copy-Item "$dir\*.exe","$dir\*.dll","$dir\*.dist" $out -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Program Files\OpenSSL" -Recurse -Include libcrypto*.dll,libssl*.dll,legacy.dll | Copy-Item -Destination $out
          Copy-Item C:\mysqlzip\mysql-8.0.30-winx64\lib\libmysql.dll $out
          Copy-Item C:\mysqlzip\mysql-8.0.30-winx64\bin\libcrypto-1_1-x64.dll,C:\mysqlzip\mysql-8.0.30-winx64\bin\libssl-1_1-x64.dll $out
          git rev-parse --short HEAD | Out-File "$out\version.txt"
          Get-ChildItem $out

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: Pandaria548-Windows
          path: dist/Pandaria548
          retention-days: 30
